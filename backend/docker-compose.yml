# API: docker compose up --build api
# Atlas is the database. Set MONGODB_URI / MONGODB_PASSWORD in .env.
services:
  api:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
